<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agent-share</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="agent-share home"><span class="brand-icon">a/</span> agent-share</a>
    </header>

    <main id="gate" class="gate" hidden>
      <form id="login-form" class="join-card">
        <h1>Join the session</h1>
        <p>Enter the passphrase from the person sharing this conversation.</p>
        <label for="passphrase">Passphrase</label>
        <input id="passphrase" type="password" required autocomplete="current-password" autofocus>
        <button type="submit">Join session <span aria-hidden="true">↗</span></button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>

    <main id="chat" class="chat" hidden>
      <section class="session-heading" aria-label="Session details">
        <h1 id="title">Shared conversation</h1>
        <div class="session-details"><span id="directory"></span><span id="count"></span></div>
      </section>
      <div id="transcript" class="transcript" aria-label="Conversation" tabindex="0">
        <div id="messages" class="messages"></div>
        <div id="empty" class="empty"><span class="empty-mark" aria-hidden="true">↗</span><p>The conversation will appear here.</p></div>
      </div>
      <div class="composer-area">
        <p id="session-error" class="error" role="alert"></p>
        <form id="message-form" class="composer" hidden>
          <label class="visually-hidden" for="message">Message</label>
          <textarea id="message" placeholder="Add to the conversation…" rows="3" required maxlength="8000"></textarea>
          <div class="composer-toolbar">
            <div class="identity"><label for="name">Sending as</label><input id="name" placeholder="Your name" required maxlength="80" autocomplete="nickname"></div>
            <button id="send" type="submit">Send <span aria-hidden="true">↑</span></button>
          </div>
        </form>
        <p id="send-status" class="composer-note" role="status"></p>
        <p id="readonly" class="readonly" hidden>This session is read-only. New messages appear automatically.</p>
      </div>
    </main>
  </body>
</html>
